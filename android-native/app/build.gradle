plugins { id 'com.android.application' }

def admobProperties = new Properties()
def admobPropertiesFile = rootProject.file("admob.properties")
if (admobPropertiesFile.exists()) {
    admobPropertiesFile.withInputStream { admobProperties.load(it) }
}
def admobAppId = admobProperties.getProperty("ADMOB_APP_ID", "ca-app-pub-3940256099942544~3347511713").trim()
def admobBannerId = admobProperties.getProperty("ADMOB_BANNER_AD_UNIT_ID", "ca-app-pub-3940256099942544/9214589741").trim()
def admobInterstitialId = admobProperties.getProperty("ADMOB_INTERSTITIAL_AD_UNIT_ID", "ca-app-pub-3940256099942544/1033173712").trim()
def admobTestMode = Boolean.parseBoolean(admobProperties.getProperty("ADMOB_TEST_MODE", "true").trim())
def effectiveAdMobAppId = admobTestMode ? "ca-app-pub-3940256099942544~3347511713" : admobAppId
def effectiveBannerId = admobTestMode ? "ca-app-pub-3940256099942544/9214589741" : admobBannerId
def effectiveInterstitialId = admobTestMode ? "ca-app-pub-3940256099942544/1033173712" : admobInterstitialId

android {
    namespace 'com.darshan.compresser'
    compileSdk 36

    defaultConfig {
        applicationId 'com.darshan.compresser'
        minSdk 29
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
        manifestPlaceholders = [ADMOB_APP_ID: effectiveAdMobAppId]
        buildConfigField 'String', 'ADMOB_APP_ID', "\"${effectiveAdMobAppId}\""
        buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', "\"${effectiveBannerId}\""
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_AD_UNIT_ID', "\"${effectiveInterstitialId}\""
        buildConfigField 'boolean', 'ADMOB_TEST_MODE', "${admobTestMode}"
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1'] }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
