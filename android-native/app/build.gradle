plugins { id 'com.android.application' }

def admobProperties = new Properties()
def admobPropertiesFile = rootProject.file("admob.properties")
if (admobPropertiesFile.exists()) {
    admobPropertiesFile.withInputStream { admobProperties.load(it) }
}
def admobAppId = admobProperties.getProperty("ADMOB_APP_ID", "ca-app-pub-9557757991977213~8750973505").trim()
def admobBannerId = admobProperties.getProperty("ADMOB_BANNER_AD_UNIT_ID", "ca-app-pub-9557757991977213/8928348733").trim()
def admobInterstitialId = admobProperties.getProperty("ADMOB_INTERSTITIAL_AD_UNIT_ID", "ca-app-pub-9557757991977213/9510802662").trim()
def admobRewardedId = admobProperties.getProperty("ADMOB_REWARDED_AD_UNIT_ID", "ca-app-pub-9557757991977213/1993993468").trim()
def admobRewardedInterstitialId = admobProperties.getProperty("ADMOB_REWARDED_INTERSTITIAL_AD_UNIT_ID", "ca-app-pub-9557757991977213/5180675414").trim()
def admobNativeId = admobProperties.getProperty("ADMOB_NATIVE_AD_UNIT_ID", "ca-app-pub-9557757991977213/5013329464").trim()
def admobAppOpenId = admobProperties.getProperty("ADMOB_APP_OPEN_AD_UNIT_ID", "ca-app-pub-9557757991977213/1074084451").trim()

android {
    namespace 'com.darshan.compresser'
    compileSdk 36

    defaultConfig {
        applicationId 'com.darshan.compresser'
        minSdk 29
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
        manifestPlaceholders = [ADMOB_APP_ID: admobAppId]
        buildConfigField 'String', 'ADMOB_APP_ID', '"' + admobAppId + '"'
        buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', '"' + admobBannerId + '"'
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_AD_UNIT_ID', '"' + admobInterstitialId + '"'
        buildConfigField 'String', 'ADMOB_REWARDED_AD_UNIT_ID', '"' + admobRewardedId + '"'
        buildConfigField 'String', 'ADMOB_REWARDED_INTERSTITIAL_AD_UNIT_ID', '"' + admobRewardedInterstitialId + '"'
        buildConfigField 'String', 'ADMOB_NATIVE_AD_UNIT_ID', '"' + admobNativeId + '"'
        buildConfigField 'String', 'ADMOB_APP_OPEN_AD_UNIT_ID', '"' + admobAppOpenId + '"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1'] }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // Defensive override for older transitive WorkManager versions.
    implementation 'androidx.work:work-runtime:2.9.1'
}
