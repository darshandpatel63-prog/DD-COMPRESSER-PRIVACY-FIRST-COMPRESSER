name: 🚀 Build Native Android APK (DD Compressor)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android version name (example: 1.0.1)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 📱 Native Android release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 🖼️ Install launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-native/app/src/main/res/drawable
          cp assets/dd-compressor-icon-512.png android-native/app/src/main/res/drawable/dd_compressor_icon.png
          test -s android-native/app/src/main/res/drawable/dd_compressor_icon.png

      - name: 🧱 Download Gradle 9.5
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.5-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.5/bin" >> "$GITHUB_PATH"

      - name: 🔎 Validate native project
        shell: bash
        run: |
          set -euo pipefail
          test -f android-native/settings.gradle
          test -f android-native/app/src/main/java/com/darshan/compresser/MainActivity.java
          test -f android-native/app/src/main/java/com/darshan/compresser/NativeCompressor.java
          if grep -Rqi "capacitor\|WebView\|ffmpeg.wasm" android-native; then
            echo "ERROR: native Android source contains a WebView/Capacitor/WASM dependency." >&2
            exit 1
          fi

      - name: 🏗️ Build native release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd android-native
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode all
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 🔐 Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-native/release.keystore
          test -s android-native/release.keystore

      - name: ✍️ Sign native APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="android-native/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="android-native/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks android-native/release.keystore --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"

      - name: 📏 Enforce APK under 25 MB
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/release/app-release.apk"
          SIZE=$(stat -c%s "$APK")
          awk 'BEGIN {printf "Final native APK size: %.2f MB\\n", '"$SIZE"'/1024/1024}'
          if [ "$SIZE" -ge $((25*1024*1024)) ]; then echo "ERROR: final native APK is not below 25 MB." >&2; exit 1; fi

      - name: 📦 Upload native APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DD-Compressor-Native-Android-APK
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          APK="android-native/app/build/outputs/apk/release/DD-Compressor-v${VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists. Refusing to overwrite it." >&2; exit 1; fi
          gh release create "$TAG" "$APK#DD-Compressor-release.apk" --title "DD Compressor v${VERSION_NAME}" --generate-notes --latest

      - name: 🧹 Remove signing material
        if: always()
        shell: bash
        run: rm -f android-native/release.keystore
