name: 🚀 Build Android APK (DD Compressor)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 📱 Build DD Compressor APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Setup Node.js
      # ---------------------------------------------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------
      # 3. Setup Java
      # ---------------------------------------------
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # ---------------------------------------------
      # 4. Prepare web files
      # ---------------------------------------------
      - name: 📁 Prepare web files
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          rsync -a \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='node_modules' \
            ./ www/

          echo "Web files:"
          find www -maxdepth 3 -type f | sort | head -300

      # ---------------------------------------------
      # 5. Initialize Node project
      # ---------------------------------------------
      - name: 📦 Initialize Node project
        shell: bash
        run: |
          set -e

          rm -f package-lock.json

          npm init -y

          npm install \
            @capacitor/cli \
            @capacitor/core \
            @capacitor/android

      # ---------------------------------------------
      # 6. Initialize Capacitor
      # ---------------------------------------------
      - name: ⚡ Initialize Capacitor
        shell: bash
        run: |
          set -e

          rm -rf android

          npx cap init \
            "DD Compressor" \
            "com.darshan.compresser" \
            --web-dir www

      # ---------------------------------------------
      # 7. Add Android
      # ---------------------------------------------
      - name: 🤖 Add Android platform
        shell: bash
        run: |
          set -e

          npx cap add android

      # ---------------------------------------------
      # 8. Sync application
      # ---------------------------------------------
      - name: 🔄 Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android

      # ---------------------------------------------
      # 9. Validate Android project
      # ---------------------------------------------
      - name: 🔍 Validate Android project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -d android/app
          test -d android/app/src

          echo "Android project created successfully."

      # ---------------------------------------------
      # 10. Build APK
      # ---------------------------------------------
      - name: 🏗️ Build Debug APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

      # ---------------------------------------------
      # 11. Verify APK
      # ---------------------------------------------
      - name: ✅ Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # ---------------------------------------------
      # 12. Upload APK
      # ---------------------------------------------
      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DD-Compresser-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
