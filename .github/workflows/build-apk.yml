name: 🚀 Build Android APK (DD Compressor)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 📱 Build DD Compressor APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Node 22 - required by current Capacitor 8
      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Java 21
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 4. Prepare web application
      - name: 📁 Prepare web files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf www
          mkdir -p www

          rsync -a \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='node_modules' \
            ./ www/

          test -f www/index.html

          echo "Web application prepared:"
          find www -maxdepth 2 -type f | sort | head -300

      # 5. Initialize Node project
      - name: 📦 Initialize Node project
        shell: bash
        run: |
          set -euo pipefail

          rm -f package.json package-lock.json

          npm init -y

          npm install --save-exact \
            @capacitor/cli@8.5.0 \
            @capacitor/core@8.5.0 \
            @capacitor/android@8.5.0

      # 6. Show versions
      - name: 🔎 Show build versions
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          npx cap --version
          npm list @capacitor/cli @capacitor/core @capacitor/android

      # 7. Initialize Capacitor
      - name: ⚡ Initialize Capacitor
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap init \
            "DD Compressor" \
            "com.darshan.compresser" \
            --web-dir www

      # 8. Add Android
      - name: 🤖 Add Android platform
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

      # 9. Sync
      - name: 🔄 Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      # 10. Verify Android project
      - name: 🔍 Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/build.gradle
          test -f android/settings.gradle
          test -d android/app

          echo "Android project:"
          find android -maxdepth 2 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \) \
            | sort

      # 11. Print Gradle / Java information
      - name: 🧪 Check Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version

          cd android

          chmod +x gradlew

          ./gradlew --version

      # 12. Build Debug APK
      - name: 🏗️ Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 13. Verify APK
      - name: ✅ Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK was not created."
            exit 1
          fi

          echo "✅ APK successfully created:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DD-Compresser-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
