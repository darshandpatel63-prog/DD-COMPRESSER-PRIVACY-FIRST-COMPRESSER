name: 🚀 Build Android APK (DD-Compresser)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 ચેકઆઉટ કોડ (Checkout Repository)
        uses: actions/checkout@v4

      - name: ⚙️ Node.js સેટઅપ
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📁 વેબ ફાઈલો સેટઅપ કરો (Fix for webDir Error)
        run: |
          mkdir www
          rsync -a --exclude='www' --exclude='.git' --exclude='.github' ./ www/

      - name: ⚡ Capacitor ઇન્સ્ટોલ કરો અને એન્ડ્રોઇડ પ્રોજેક્ટ બનાવો
        run: |
          npm init -y
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
          npx cap init "DD Compresser" "com.darshan.compresser" --web-dir www
          npx cap add android
          npx cap sync android

      - name: ☕ Java JDK 17 સેટઅપ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ APK બિલ્ડ કરો (Compile Android)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📦 ફાઇનલ APK ડાઉનલોડ માટે આપો
        uses: actions/upload-artifact@v4
        with:
          name: DD-Compresser-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
