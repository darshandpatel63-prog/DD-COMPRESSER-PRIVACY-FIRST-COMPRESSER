name: 🚀 Build Android APK (DD-Compresser)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 ચેકઆઉટ કોડ (Checkout Repository)
        uses: actions/checkout@v4

      - name: ⚙️ Node.js સેટઅપ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Java JDK 17 સેટઅપ (With Cache Fix)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📁 વેબ ફાઈલો સેટઅપ
        run: |
          mkdir -p www
          rsync -a --exclude='www' --exclude='.git' --exclude='.github' ./ www/

      - name: ⚡ Capacitor ઇન્સ્ટોલ અને કન્ફિગર
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "DD Compresser" "com.darshan.compresser" --web-dir www
          npx cap add android

      - name: 🏗️ APK બિલ્ડ કરો (Memory Optimized)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      - name: 📦 ફાઇનલ APK ડાઉનલોડ માટે આપો
        uses: actions/upload-artifact@v4
        with:
          name: DD-Compresser-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
