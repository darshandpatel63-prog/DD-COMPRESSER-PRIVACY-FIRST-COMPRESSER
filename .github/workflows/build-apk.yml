name: 🚀 Build Android APK (DD Compressor)

on:
  workflow_dispatch:
    inputs:
      ads_enabled:
        description: "Enable AdMob for this build (leave OFF for first store release)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: 📱 Build DD Compressor APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 📁 Prepare web files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          rsync -a --exclude='www' --exclude='.git' --exclude='.github' --exclude='android' --exclude='node_modules' --exclude='*.md' --exclude='LICENSE' ./ www/
          test -f www/index.html
          test -f www/assets/dd-compressor-icon-512.png
          test ! -e www/PRIVACY.md
          test ! -e www/TERMS.md
          test ! -e www/DISCLAIMER.md

      - name: 📦 Initialize Capacitor project
        shell: bash
        env:
          ADS_ENABLED: ${{ inputs.ads_enabled }}
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json
          npm init -y
          npm install --save-exact \
            @capacitor/cli@8.5.2 \
            @capacitor/core@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/filesystem@8.0.0 \
            @capacitor/share@8.0.0
          if [ "$ADS_ENABLED" = "true" ]; then
            npm install --save-exact @capacitor-community/admob@8.1.0
          else
            echo "STORE-FIRST BUILD: skipping AdMob plugin to keep ads/SDK out of the first APK."
          fi

      - name: ⚡ Initialize Capacitor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap init "DD Compressor" "com.darshan.compresser" --web-dir www
          npx cap add android

      - name: 📢 Configure AdMob mode
        shell: bash
        env:
          ADS_ENABLED: ${{ inputs.ads_enabled }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
        run: |
          set -euo pipefail
          if [ "$ADS_ENABLED" != "true" ]; then
            echo "STORE-FIRST BUILD: AdMob disabled."
            exit 0
          fi
          test -n "$ADMOB_APP_ID" || { echo "Missing ADMOB_APP_ID secret for monetized build." >&2; exit 1; }
          test -n "$ADMOB_BANNER_AD_UNIT_ID" || { echo "Missing ADMOB_BANNER_AD_UNIT_ID secret for monetized build." >&2; exit 1; }
          test -n "$ADMOB_INTERSTITIAL_AD_UNIT_ID" || { echo "Missing ADMOB_INTERSTITIAL_AD_UNIT_ID secret for monetized build." >&2; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('www/js/admob.js')
          s=p.read_text()
          s=s.replace("enabled: false", "enabled: true", 1)
          s=s.replace("testMode: false", "testMode: false", 1)
          s=s.replace("appId: ''", "appId: " + repr(os.environ["ADMOB_APP_ID"]), 1)
          s=s.replace("bannerId: ''", "bannerId: " + repr(os.environ["ADMOB_BANNER_AD_UNIT_ID"]), 1)
          s=s.replace("interstitialId: ''", "interstitialId: " + repr(os.environ["ADMOB_INTERSTITIAL_AD_UNIT_ID"]), 1)
          p.write_text(s)
          r=Path('android/app/src/main/res/values/strings.xml')
          s=r.read_text()
          s=s.replace('</resources>', '    <string name="admob_app_id">'+os.environ["ADMOB_APP_ID"]+'</string>\n</resources>')
          r.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          marker='    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />\n'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s=s.replace('</application>', marker+'</application>')
          m.write_text(s)
          PY

      - name: 🎨 Install DD Compressor Android launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON="www/assets/dd-compressor-icon-512.png"
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES="android/app/src/main/res"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "$RES/mipmap-$d"; done
          if command -v magick >/dev/null 2>&1; then IM_CMD="magick"; else IM_CMD="convert"; fi
          "$IM_CMD" "$ICON" -resize 48x48! "$RES/mipmap-mdpi/dd_compressor_icon.png"
          "$IM_CMD" "$ICON" -resize 72x72! "$RES/mipmap-hdpi/dd_compressor_icon.png"
          "$IM_CMD" "$ICON" -resize 96x96! "$RES/mipmap-xhdpi/dd_compressor_icon.png"
          "$IM_CMD" "$ICON" -resize 144x144! "$RES/mipmap-xxhdpi/dd_compressor_icon.png"
          "$IM_CMD" "$ICON" -resize 192x192! "$RES/mipmap-xxxhdpi/dd_compressor_icon.png"
          sed -i -e 's/@mipmap\/ic_launcher_round/@mipmap\/dd_compressor_icon/g' -e 's/@mipmap\/ic_launcher/@mipmap\/dd_compressor_icon/g' android/app/src/main/AndroidManifest.xml

      - name: 🔄 Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q 'Filesystem' android/app/src/main/assets/capacitor.plugins.json
          grep -q 'Share' android/app/src/main/assets/capacitor.plugins.json

      - name: 📏 Report native web payload size
        shell: bash
        run: |
          set -euo pipefail
          BYTES=$(du -sb www | cut -f1)
          awk "BEGIN {printf \"Native web payload: %.2f MB\\n\", $BYTES/1024/1024}"

      - name: 🔐 Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret." >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret." >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret." >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret." >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          test -s android/release.keystore

      - name: 🏗️ Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: ✍️ Sign release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="android/app/build/outputs/apk/release/DD-Compresser-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks android/release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"
          test -f "$SIGNED"

      - name: 🧹 Remove signing material from workspace
        if: always()
        shell: bash
        run: |
          rm -f android/release.keystore

      - name: 📏 Enforce APK size target
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/DD-Compresser-release.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          awk 'BEGIN {printf "Final signed release APK size: %.2f MB\n", '"$SIZE"'/1024/1024}'
          if [ "$SIZE" -ge $((25*1024*1024)) ]; then echo "ERROR: final signed release APK is not below 25 MB" >&2; exit 1; fi

      - name: 📦 Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: DD-Compresser-Android-Release-APK
          path: android/app/build/outputs/apk/release/DD-Compresser-release.apk
          if-no-files-found: error
          retention-days: 30
