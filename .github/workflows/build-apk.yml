name: 🚀 Build Android APK (DD Compressor)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 📱 Build DD Compressor APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 📁 Prepare web files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='node_modules' \
            ./ www/
          test -f www/index.html
          test -f www/assets/dd-compressor-icon-512.png

      - name: 📦 Initialize Node project
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json
          npm init -y
          npm install --save-exact \
            @capacitor/cli@8.5.0 \
            @capacitor/core@8.5.0 \
            @capacitor/android@8.5.0 \
            @capacitor/filesystem@8.0.0 \
            @capacitor/share@8.0.0

      - name: 🔎 Verify Capacitor plugins
        shell: bash
        run: |
          set -euo pipefail
          npx cap --version
          npm list @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share

      - name: ⚡ Initialize Capacitor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap init \
            "DD Compressor" \
            "com.darshan.compresser" \
            --web-dir www

      - name: 🤖 Add Android platform
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android

      - name: 🎨 Install DD Compressor Android launcher icon
        shell: bash
        run: |
          set -euo pipefail

          ICON="www/assets/dd-compressor-icon-512.png"
          test -f "$ICON"

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          RES="android/app/src/main/res"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
          done

          # Ubuntu runners may provide ImageMagick 6, where the executable is
          # `convert` rather than the ImageMagick 7 `magick` command.
          if command -v magick >/dev/null 2>&1; then
            IM_CMD="magick"
          elif command -v convert >/dev/null 2>&1; then
            IM_CMD="convert"
          else
            echo "ImageMagick executable not found after installation." >&2
            exit 1
          fi

          echo "Using ImageMagick command: $IM_CMD"
          "$IM_CMD" --version | head -n 2

          "$IM_CMD" "$ICON" -resize 48x48!   "$RES/mipmap-mdpi/dd_compressor_icon.png"
          "$IM_CMD" "$ICON" -resize 72x72!   "$RES/mipmap-hdpi/dd_compressor_icon.png"
          "$IM_CMD" "$ICON" -resize 96x96!   "$RES/mipmap-xhdpi/dd_compressor_icon.png"
          "$IM_CMD" "$ICON" -resize 144x144! "$RES/mipmap-xxhdpi/dd_compressor_icon.png"
          "$IM_CMD" "$ICON" -resize 192x192! "$RES/mipmap-xxxhdpi/dd_compressor_icon.png"

          sed -i \
            -e 's/@mipmap\/ic_launcher_round/@mipmap\/dd_compressor_icon/g' \
            -e 's/@mipmap\/ic_launcher/@mipmap\/dd_compressor_icon/g' \
            android/app/src/main/AndroidManifest.xml

          grep -E 'android:(icon|roundIcon)=' android/app/src/main/AndroidManifest.xml
          test -f "$RES/mipmap-mdpi/dd_compressor_icon.png"
          test -f "$RES/mipmap-xxxhdpi/dd_compressor_icon.png"

      - name: 🔄 Sync Capacitor and register native plugins
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

          echo "Registered Capacitor plugins:"
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q 'Filesystem' android/app/src/main/assets/capacitor.plugins.json
          grep -q 'Share' android/app/src/main/assets/capacitor.plugins.json

      - name: 🔍 Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/build.gradle
          test -f android/settings.gradle
          test -d android/app

      - name: 🧪 Check Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: 🏗️ Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: ✅ Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DD-Compresser-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
