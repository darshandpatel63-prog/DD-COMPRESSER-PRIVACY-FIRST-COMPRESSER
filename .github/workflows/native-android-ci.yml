name: 🧪 Native Android CI Test (DD Compressor)

on:
  push:
    branches:
      - main
      - feat/native-admob-integration
    paths:
      - 'android-native/**'
      - 'assets/dd-compressor-icon-512.png'
      - '.github/workflows/native-android-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - 'assets/dd-compressor-icon-512.png'
      - '.github/workflows/native-android-ci.yml'

permissions:
  contents: read

jobs:
  native-release-build-test:
    name: Build and validate native release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-native/app/src/main/res/drawable
          cp assets/dd-compressor-icon-512.png android-native/app/src/main/res/drawable/dd_compressor_icon.png
          test -s android-native/app/src/main/res/drawable/dd_compressor_icon.png

      - name: Download Gradle 9.5.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: Validate native source
        shell: bash
        run: |
          set -euo pipefail
          test -f android-native/settings.gradle
          test -f android-native/app/src/main/java/com/darshan/compresser/MainActivity.java
          test -f android-native/app/src/main/java/com/darshan/compresser/NativeCompressor.java
          if grep -Rqi "capacitor\\|WebView\\|ffmpeg.wasm" android-native; then
            echo "ERROR: native Android source contains a WebView/Capacitor/WASM dependency." >&2
            exit 1
          fi

      - name: Build native release APK (no signing or release publishing)
        shell: bash
        run: |
          set -euo pipefail
          cd android-native
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode all
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          awk 'BEGIN {printf "Unsigned native APK size: %.2f MB\\n", '"$SIZE"'/1024/1024}'
          if [ "$SIZE" -ge $((25*1024*1024)) ]; then
            echo "ERROR: unsigned APK is not below 25 MB." >&2
            exit 1
          fi

      # Intentionally no Gradle cache, artifact upload, signing or GitHub Release.
      # This workflow validates the code while avoiding persistent Actions cache/artifact storage.
